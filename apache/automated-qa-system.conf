# Automated QA System — server config notes
#
# DOCUMENTATION of two small additions made on the VPS. Nothing here installs
# automatically. Every change is additive — no server file is replaced.
#
# Request path: nginx :443  →  Apache :8443  →  docker 127.0.0.1:7071
#
# Keep this file in sync with the server. If VestaCP ever regenerates the vhost
# and drops the proxy block, this is the record you restore from.
#
# ════════════════════════════════════════════════════════════════════════
# 1. Reverse proxy
#    FILE: /home/admin/conf/web/employee.netovation.eu.httpd.ssl.conf
#    ADD directly below the existing MailCraft ProxyPass pair, matching its style.
#
#      # === Reverse Proxy to Automated QA System (Next.js on 7071) ===
#      ProxyPass "/automated-qa-system" "http://127.0.0.1:7071/automated-qa-system"
#      ProxyPassReverse "/automated-qa-system" "http://127.0.0.1:7071/automated-qa-system"
#
#    NO TRAILING SLASHES — this is load-bearing, not style.
#    With "/automated-qa-system/" the bare path is not matched by ProxyPass, so
#    Apache's mod_dir sees the real directory in the docroot and 301s to add a
#    slash; Next.js (trailingSlash: false) then 308s it straight back. Infinite
#    redirect loop. Dropping the slashes makes ProxyPass claim the bare path
#    before mod_dir ever runs.
#
#    NOTE: MailCraft's block still has the trailing-slash form and exhibits the
#    same loop (/mailcraft -> 301 -> /mailcraft/ -> 308 -> /mailcraft). Left
#    alone deliberately — out of scope for this project. Same one-line fix if
#    you want it.
#
#    Note: this file is VestaCP-generated. It already carries the MailCraft,
#    leave-system, department-repository and uptime-report-system config, so it
#    is the consistent place to look — but a Vesta vhost rebuild would wipe all
#    of it, not just ours. Back it up before editing:
#      cp employee.netovation.eu.httpd.ssl.conf{,.bak-$(date +%F)}
#
# ════════════════════════════════════════════════════════════════════════
# 2. Exempt the path from basic auth  (TWO edits, same file)
#    FILE: /home/admin/web/employee.netovation.eu/public_html/.htaccess
#
#    2a. ADD one line beside the existing SetEnvIf lines:
#
#          SetEnvIf Request_URI "^/automated-qa-system" noauth=1
#
#        The vhost is password-protected with an allowlist; this is the exact
#        mechanism /mailcraft already uses to stay public.
#
#    2b. APPEND to the existing SPA rewrite exclusion alternation:
#
#          before: !^/(leave-system|department-repository|uptime-report-system|mailcraft)
#          after:  !^/(leave-system|department-repository|uptime-report-system|mailcraft|automated-qa-system)
#
#        Without this, requests get rewritten to the root index.html and the
#        dashboard 404s in a way that looks like a proxy failure.
#
# ════════════════════════════════════════════════════════════════════════
# No nginx change needed. Its static-file regex catches /_next/*.js and .css,
# but `try_files $uri @fallback` sends the miss back to Apache. MailCraft
# already proves this path works.
#
# Verify, then reload — configtest first, never reload blind:
#   httpd -t
#   systemctl reload httpd
