name: Deploy Automated QA System

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race on the VPS.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/automated-qa-system-web:latest
            ghcr.io/${{ env.OWNER }}/automated-qa-system-web:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/automated-qa-system-web:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/automated-qa-system-web:cache,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ env.OWNER }}/automated-qa-system-web:migrate
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/automated-qa-system-web:cache

      # Built here, not on the VPS — the Playwright image is ~2GB and building
      # it on Contabo every push is slow and thrashes the disk.
      - name: Build and push runner image
        uses: docker/build-push-action@v5
        with:
          context: ./runner
          file: ./runner/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/automated-qa-system-runner:latest
            ghcr.io/${{ env.OWNER }}/automated-qa-system-runner:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/automated-qa-system-runner:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/automated-qa-system-runner:cache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Same convention as MailCraft and leave-system on this box.
          # Direct filesystem access to this dir is denied by its own .htaccess;
          # the dashboard is reached via ProxyPass, which resolves before the
          # filesystem, so the deny rule does not affect the running app.
          APP_DIR: /home/admin/web/employee.netovation.eu/public_html/automated-qa-system
          # Brand test accounts, synced to the server .env on every deploy so
          # rotating an account never requires an SSH session. Deliberately ONLY
          # the per-brand logins: POSTGRES_PASSWORD, INGEST_TOKEN and
          # DATABASE_URL differ per environment and are never pushed from here —
          # scripts/set-env.sh refuses them outright as a second line of defence.
          #
          # An unset secret arrives as an empty string, and the sync SKIPS
          # empties rather than writing them. That is what makes listing a key
          # here harmless: until its secret actually exists the server value is
          # left exactly as it is. So every brand is listed, and each activates
          # only when you choose to set its secret.
          #
          # Base URLs are NOT synced. They are configuration rather than
          # credentials, they change almost never, and a wrong one takes a brand
          # down — set those with scripts/set-env.sh if a host ever moves.
          STAKES_USERNAME: ${{ secrets.STAKES_USERNAME }}
          STAKES_PASSWORD: ${{ secrets.STAKES_PASSWORD }}
          STAKES3_USERNAME: ${{ secrets.STAKES3_USERNAME }}
          STAKES3_PASSWORD: ${{ secrets.STAKES3_PASSWORD }}
          STAKESCASINO_USERNAME: ${{ secrets.STAKESCASINO_USERNAME }}
          STAKESCASINO_PASSWORD: ${{ secrets.STAKESCASINO_PASSWORD }}
          # Dormant: x7 has no entry in COLUMNS so it never runs. Wired up now
          # so enabling it later is a secret plus a push, not an SSH session.
          X7_USERNAME: ${{ secrets.X7_USERNAME }}
          X7_PASSWORD: ${{ secrets.X7_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,APP_DIR,STAKES_USERNAME,STAKES_PASSWORD,STAKES3_USERNAME,STAKES3_PASSWORD,STAKESCASINO_USERNAME,STAKESCASINO_PASSWORD,X7_USERNAME,X7_PASSWORD
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u jayrdoria --password-stdin
            cd "$APP_DIR"

            # compose file, apache snippet and cron wrapper live on the server
            git pull

            # ── Guard: the server .env must not carry local development values ──
            #
            # The local and production .env files differ by design, and uploading
            # the local one over the server's has happened. It is invisible at the
            # time: running containers keep their old environment, so everything
            # looks healthy until a deploy recreates them — at which point web
            # cannot authenticate to Postgres and the health gate fails.
            #
            # By then `up -d web` has already replaced the working container, so
            # the dashboard is down. Checking here, before any docker command,
            # turns that outage into a failed deploy with the old container still
            # serving traffic.
            #
            # DATABASE_URL is checked by presence alone: production must not have
            # it at all, since compose builds it from POSTGRES_* and the container
            # hostname. Any value here is wrong by definition.
            if grep -qE '^(POSTGRES_PASSWORD=qa_local_dev_pw|INGEST_TOKEN=local_dev_token|DATABASE_URL=)' .env; then
              echo "ABORT: the server .env contains local development values."
              echo "Offending keys (values redacted):"
              grep -nE '^(POSTGRES_PASSWORD=qa_local_dev_pw|INGEST_TOKEN=local_dev_token|DATABASE_URL=)' .env \
                | sed 's/=.*/=<redacted>/'
              echo ""
              echo "Nothing was changed — the running containers are untouched."
              echo "Fix .env with scripts/set-env.sh, then re-run this deploy."
              exit 1
            fi

            # ── Sync brand credentials from repository secrets ──────────────
            #
            # Adding or rotating a mirror account should not require an SSH
            # session. These are written into the server .env here, before any
            # container is created, so the next cron run picks them up.
            #
            # Three deliberate safety properties:
            #   1. WHITELIST — only per-brand logins are ever written. The keys
            #      that differ per environment are not in this list at all.
            #   2. SKIP EMPTY — an unset repository secret arrives as "". Writing
            #      it would overwrite a working credential with a blank and break
            #      the brand on the next tick, so empties are skipped, not synced.
            #   3. set-env.sh REFUSES the protected keys even if one were passed,
            #      so a mistake in this file cannot reach POSTGRES_PASSWORD.
            #
            # Invoked via `bash` rather than ./: the repo is developed on Windows
            # where core.filemode is false, so the executable bit is not reliably
            # recorded and ./scripts/set-env.sh could fail with permission denied.
            cp .env .env.predeploy

            sync_cred() {
              if [ -z "${2:-}" ]; then
                echo "  $1: no repository secret set — server value left untouched"
                return 0
              fi
              bash scripts/set-env.sh "$1" "$2" > /dev/null
              echo "  $1: synced"
            }

            echo "Syncing brand credentials from repository secrets:"
            sync_cred STAKES_USERNAME       "${STAKES_USERNAME:-}"
            sync_cred STAKES_PASSWORD       "${STAKES_PASSWORD:-}"
            sync_cred STAKES3_USERNAME      "${STAKES3_USERNAME:-}"
            sync_cred STAKES3_PASSWORD      "${STAKES3_PASSWORD:-}"
            sync_cred STAKESCASINO_USERNAME "${STAKESCASINO_USERNAME:-}"
            sync_cred STAKESCASINO_PASSWORD "${STAKESCASINO_PASSWORD:-}"
            sync_cred X7_USERNAME           "${X7_USERNAME:-}"
            sync_cred X7_PASSWORD           "${X7_PASSWORD:-}"

            docker pull ghcr.io/jayrdoria/automated-qa-system-web:latest
            docker pull ghcr.io/jayrdoria/automated-qa-system-web:migrate
            docker pull ghcr.io/jayrdoria/automated-qa-system-runner:latest

            mkdir -p artifacts logs
            # pwuser in the Playwright image is uid 1001. The bind mount is
            # unwritable without this, and the runner fails with EACCES.
            # Done every deploy so a fresh clone needs no manual chown.
            chown -R 1001:1001 artifacts

            # Postgres must be up and healthy before migrations run.
            docker compose -f docker-compose.prod.yml up -d postgres

            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate

            docker compose -f docker-compose.prod.yml up -d --no-deps web

            # Deploy gate: the app must actually answer and reach Postgres.
            # Retries because the container needs a moment to bind the port.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:7071/automated-qa-system/api/health > /dev/null; then
                echo "health check passed"
                break
              fi
              if [ "$i" = "15" ]; then
                echo "health check FAILED after 15 attempts"
                docker compose -f docker-compose.prod.yml logs --tail=50 web
                exit 1
              fi
              sleep 2
            done

            # Second gate: the runner image boots and Chromium launches.
            docker compose -f docker-compose.prod.yml --profile batch run --rm runner \
              npx playwright test tests/smoke.spec.ts

            docker image prune -f

            echo "Deployed — https://employee.netovation.eu/automated-qa-system"
